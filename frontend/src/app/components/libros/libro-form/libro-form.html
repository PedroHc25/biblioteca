<main class="container py-4" style="max-width: 720px">
  <a
    routerLink="/libros"
    class="link-secondary text-decoration-none"
  >
    ← Volver a libros
  </a>

  <section class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">

      <h1 class="h3 mb-4">
        {{ id ? 'Editar libro' : 'Registrar libro' }}
      </h1>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="cargando" class="text-secondary">
        Cargando datos…
      </div>

      <form
        *ngIf="!cargando"
        [formGroup]="form"
        (ngSubmit)="guardar()"
        novalidate
      >
        <div class="mb-3">
          <label for="titulo" class="form-label">
            Título
          </label>

          <input
            id="titulo"
            class="form-control"
            formControlName="titulo"
            maxlength="200"
          >

          <div
            *ngIf="
              form.controls.titulo.touched &&
              form.controls.titulo.invalid
            "
            class="text-danger small mt-1"
          >
            Ingresa el título.
          </div>
        </div>

        <div class="mb-3">
          <label for="autorId" class="form-label">
            Autor
          </label>

          <select
            id="autorId"
            class="form-select"
            formControlName="autorId"
          >
            <option [ngValue]="null" disabled>
              Selecciona un autor
            </option>

            <option
              *ngFor="let autor of autores"
              [ngValue]="autor.id"
            >
              {{ autor.nombreCompleto }}
            </option>
          </select>

          <div
            *ngIf="
              form.controls.autorId.touched &&
              form.controls.autorId.invalid
            "
            class="text-danger small mt-1"
          >
            Selecciona un autor.
          </div>

          <div *ngIf="autores.length === 0" class="form-text">
            Primero registra un autor activo.
          </div>
        </div>

        <div class="row">
          <div class="col-md-7 mb-3">
            <label for="categoria" class="form-label">
              Categoría
            </label>

            <select
              id="categoria"
              class="form-select"
              formControlName="categoria"
            >
              <option value="" disabled>
                Selecciona una categoría
              </option>

              <option
                *ngFor="let categoria of categorias"
                [value]="categoria.nombre"
              >
                {{ categoria.nombre }}
              </option>
            </select>

            <div
              *ngIf="
                form.controls.categoria.touched &&
                form.controls.categoria.invalid
              "
              class="text-danger small mt-1"
            >
              Selecciona una categoría.
            </div>
          </div>

          <div class="col-md-5 mb-3">
            <label for="anio" class="form-label">
              Año
            </label>

            <input
              id="anio"
              type="number"
              class="form-control"
              formControlName="anio"
              min="0"
              max="2100"
            >

            <div
              *ngIf="
                form.controls.anio.touched &&
                form.controls.anio.invalid
              "
              class="text-danger small mt-1"
            >
              Ingresa un año válido.
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label for="estado" class="form-label">
            Estado
          </label>

          <select
            id="estado"
            class="form-select"
            formControlName="estado"
          >
            <option value="" disabled>
              Selecciona un estado
            </option>

            <option value="Disponible">
              Disponible
            </option>

            <option value="Prestado">
              Prestado
            </option>

            <option value="Inactivo">
              Inactivo
            </option>
          </select>

          <div
            *ngIf="
              form.controls.estado.touched &&
              form.controls.estado.invalid
            "
            class="text-danger small mt-1"
          >
            Selecciona un estado.
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a
            routerLink="/libros"
            class="btn btn-outline-secondary"
          >
            Cancelar
          </a>

          <button
            class="btn btn-primary"
            type="submit"
            [disabled]="guardando"
          >
            {{
              guardando
                ? 'Guardando…'
                : id
                  ? 'Actualizar libro'
                  : 'Guardar libro'
            }}
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
