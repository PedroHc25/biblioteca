<main class="container py-4" style="max-width: 720px">
  <a
    routerLink="/autores"
    class="link-secondary text-decoration-none"
  >
    ← Volver a autores
  </a>

  <section class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">
      <h1 class="h3 mb-4">
        {{ id ? 'Editar autor' : 'Nuevo autor' }}
      </h1>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="cargando" class="text-secondary">
        Cargando autor…
      </div>

      <form
        *ngIf="!cargando"
        [formGroup]="form"
        (ngSubmit)="guardar()"
        novalidate
      >
        <div class="mb-3">
          <label for="nombreCompleto" class="form-label">
            Nombre completo
          </label>

          <input
            id="nombreCompleto"
            class="form-control"
            formControlName="nombreCompleto"
          >

          <div
            *ngIf="
              form.controls.nombreCompleto.touched &&
              form.controls.nombreCompleto.invalid
            "
            class="text-danger small mt-1"
          >
            El nombre completo es obligatorio.
          </div>
        </div>

        <div class="mb-3">
          <label for="nacionalidad" class="form-label">
            Nacionalidad (opcional)
          </label>

          <input
            id="nacionalidad"
            class="form-control"
            formControlName="nacionalidad"
            placeholder="Ej. Peruana"
          >
        </div>

        <div class="mb-4">
          <label for="estado" class="form-label">
            Estado
          </label>

          <select
            id="estado"
            class="form-select"
            formControlName="estado"
          >
            <option value="" disabled>
              Selecciona un estado
            </option>

            <option value="Activo">
              Activo
            </option>

            <option value="Inactivo">
              Inactivo
            </option>
          </select>

          <div
            *ngIf="
              form.controls.estado.touched &&
              form.controls.estado.invalid
            "
            class="text-danger small mt-1"
          >
            Selecciona un estado.
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a
            routerLink="/autores"
            class="btn btn-outline-secondary"
          >
            Cancelar
          </a>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="guardando"
          >
            {{
              guardando
                ? 'Guardando…'
                : id
                  ? 'Actualizar autor'
                  : 'Guardar autor'
            }}
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
