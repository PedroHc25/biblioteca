<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <div>
      <h1 class="h2 mb-0">Usuarios</h1>
    </div><a routerLink="/usuarios/nuevo" class="btn btn-primary">+ Nuevo usuario</a>
  </div>
  <div *ngIf="error" class="alert alert-danger">{{ error }} <button class="btn btn-sm btn-outline-danger ms-2"
      (click)="cargar()">Reintentar</button></div>
  <div *ngIf="cargando" class="text-secondary py-4">Cargando usuarios…</div>
  <div *ngIf="!cargando && !error && usuarios.length === 0" class="alert alert-info">Todavía no hay usuarios
    registrados.</div>
  <div *ngIf="!cargando && usuarios.length" class="table-responsive card border-0 shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th>Documento</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td class="fw-semibold">{{ usuario.nombre }} {{ usuario.apellido }}</td>
          <td>{{ usuario.dni }}</td>
          <td>{{ usuario.correo }}</td>
          <td>{{ usuario.telefono || '—' }}</td>
          <td><span class="badge text-bg-secondary">{{ usuario.rol || 'USER' }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
