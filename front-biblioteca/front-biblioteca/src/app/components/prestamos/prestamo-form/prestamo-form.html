<main class="container py-4" style="max-width: 760px"><a routerLink="/prestamos" class="link-secondary text-decoration-none">← Volver a préstamos</a><section class="card border-0 shadow-sm mt-3"><div class="card-body p-4"><p class="text-primary fw-semibold mb-1">CIRCULACIÓN</p><h1 class="h3 mb-4">Nuevo préstamo</h1><div *ngIf="error" class="alert alert-danger">{{ error }}</div><div *ngIf="cargando" class="text-secondary">Cargando datos…</div>
<form *ngIf="!cargando" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <div class="mb-3"><label for="usuario" class="form-label">Usuario</label><select id="usuario" class="form-select" formControlName="usuarioId"><option [ngValue]="null" disabled>Selecciona un usuario</option><option *ngFor="let usuario of usuarios" [ngValue]="usuario.id">{{ usuario.nombre }} {{ usuario.apellido }} — {{ usuario.correo }}</option></select><div *ngIf="form.controls.usuarioId.touched && form.controls.usuarioId.invalid" class="text-danger small">Selecciona un usuario.</div></div>
  <div class="mb-3"><label for="libro" class="form-label">Libro</label><select id="libro" class="form-select" formControlName="libroId"><option [ngValue]="null" disabled>Selecciona un libro</option><option *ngFor="let libro of libros" [ngValue]="libro.id">{{ libro.titulo }} — {{ libro.autor }} ({{ libro.estado || 'Sin estado' }})</option></select><div *ngIf="form.controls.libroId.touched && form.controls.libroId.invalid" class="text-danger small">Selecciona un libro.</div><div *ngIf="libros.length === 0" class="form-text">Primero registra un libro.</div></div>
  <div class="row"><div class="col-md-6 mb-4"><label for="fechaPrestamo" class="form-label">Fecha de préstamo</label><input id="fechaPrestamo" type="date" class="form-control" formControlName="fechaPrestamo"></div><div class="col-md-6 mb-4"><label for="fechaDevolucion" class="form-label">Fecha de devolución prevista</label><input id="fechaDevolucion" type="date" class="form-control" formControlName="fechaDevolucion"></div></div>
  <div class="d-flex justify-content-end gap-2"><a routerLink="/prestamos" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-primary" [disabled]="guardando || usuarios.length === 0 || libros.length === 0">{{ guardando ? 'Guardando…' : 'Registrar préstamo' }}</button></div>
</form></div></section></main>
