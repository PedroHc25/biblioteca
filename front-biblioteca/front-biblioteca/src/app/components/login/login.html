
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4">

    <h3 class="text-center mb-4">Biblioteca UTP</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input
          type="text"
          class="form-control"
          id="usuario"
          formControlName="usuario"
          placeholder="Ej: admin"
        />
        <div
          *ngIf="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched"
          class="text-danger"
        >
          <div *ngIf="loginForm.get('usuario')?.hasError('required')">
            El usuario es obligatorio.
          </div>

          <div *ngIf="loginForm.get('usuario')?.hasError('minlength')">
            Debe tener al menos 3 caracteres.
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>

        <input
          type="password"
          class="form-control"
          id="password"
          formControlName="password"
          placeholder="Ingresa tu contraseña"
        />

        <div
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="text-danger"
        >
          <div *ngIf="loginForm.get('password')?.hasError('required')">
            La contraseña es obligatoria.
          </div>

          <div *ngIf="loginForm.get('password')?.hasError('minlength')">
            Debe tener al menos 4 caracteres.
          </div>
        </div>
      </div>

      <!-- Mensajes -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Iniciar sesión
      </button>

      <button
        type="button"
        class="btn btn-outline-secondary w-100 mt-2"
        (click)="onRegistro()"
      >
        Registrarse
      </button>

    </form>
  </div>
</div>
