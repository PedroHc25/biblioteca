<main class="container py-4" style="max-width: 720px">
  <a routerLink="/libros" class="link-secondary text-decoration-none">← Volver a libros</a>
  <section class="card border-0 shadow-sm mt-3"><div class="card-body p-4">
    <p class="text-primary fw-semibold mb-1">CATÁLOGO</p><h1 class="h3 mb-4">{{ id ? 'Editar libro' : 'Registrar libro' }}</h1>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
      <div class="mb-3"><label for="titulo" class="form-label">Título</label><input id="titulo" class="form-control" formControlName="titulo" maxlength="200"><div *ngIf="form.controls.titulo.touched && form.controls.titulo.invalid" class="text-danger small mt-1">Ingresa el título.</div></div>
      <div class="mb-3"><label for="autor" class="form-label">Autor</label><input id="autor" class="form-control" formControlName="autor" maxlength="160"><div *ngIf="form.controls.autor.touched && form.controls.autor.invalid" class="text-danger small mt-1">Ingresa el autor.</div></div>
      <div class="row"><div class="col-md-7 mb-3"><label for="categoria" class="form-label">Categoría</label><select id="categoria" class="form-select" formControlName="categoria"><option value="">Sin categoría</option><option *ngFor="let categoria of categorias" [value]="categoria.nombre">{{ categoria.nombre }}</option></select></div>
      <div class="col-md-5 mb-3"><label for="anio" class="form-label">Año</label><input id="anio" type="number" class="form-control" formControlName="anio" min="0" max="2100"></div></div>
      <div class="mb-4"><label for="estado" class="form-label">Estado</label><select id="estado" class="form-select" formControlName="estado"><option>Disponible</option><option>Prestado</option><option>Inactivo</option></select></div>
      <div class="d-flex justify-content-end gap-2"><a routerLink="/libros" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-primary" type="submit" [disabled]="guardando">{{ guardando ? 'Guardando…' : 'Guardar libro' }}</button></div>
    </form>
  </div></section>
</main>
