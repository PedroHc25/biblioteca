<div class="container mt-4" style="max-width: 600px;">
  <div class="card shadow p-4">
    <h3 class="mb-3">Registrar / Editar Libro</h3>
    
    <form>
      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" placeholder="Título del libro">
      </div>

      <div class="mb-3">
        <label for="autor" class="form-label">Autor</label>
        <input type="text" class="form-control" id="autor" placeholder="Autor del libro">
      </div>

      <div class="mb-3">
        <label for="categoria" class="form-label">Categoría</label>
        <select class="form-select" id="categoria">
          <option selected disabled>Seleccione una categoría</option>
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <a routerLink="/libros" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar Libro</button>
      </div>
    </form>
  </div>
</div>
